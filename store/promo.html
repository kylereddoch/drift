<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Drift promotional artwork</title>
<style>
* { box-sizing:border-box; }
html,body { width:100%; height:100%; margin:0; overflow:hidden; }
body { background:#2755d8; color:white; font-family:"Segoe UI",system-ui,sans-serif; display:grid; place-items:center; }
.orbit { position:absolute; border:1px solid #ffffff2e; width:590px; height:230px; border-radius:50%; transform:rotate(-35deg); }
.orbit.two { width:520px; height:450px; transform:rotate(28deg); border-color:#ffffff18; }
.brand { position:relative; display:flex; align-items:center; gap:18px; }
.mark { width:105px; height:105px; }
.word { font-size:83px; line-height:1; font-weight:750; letter-spacing:-5px; padding-bottom:12px; }
.dot { color:#c9d7ff; }
.glint { position:absolute; width:9px; height:9px; border-radius:50%; background:#c8d6ff; top:47px; right:77px; }
@media(min-width:800px) { .brand { gap:32px; } .mark { width:180px; height:180px; } .word { font-size:154px; letter-spacing:-10px; padding-bottom:22px; } .orbit { width:1200px; height:450px; } .orbit.two { width:1010px; height:730px; } .glint { width:13px; height:13px; right:280px; top:115px; } }
</style></head>

</html>
